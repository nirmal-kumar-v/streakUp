<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="35%" stop-color="#ea580c"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="270" r="140" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>

  <!-- Flame Icon Path (Scaled and Centered) -->
  <g transform="translate(106, 86) scale(12.5)" filter="url(#glow)">
    <path
      d="M12 2c.5 1.5 1 3 3 4 2.5 1.25 4 3.5 4 6.5 0 4.14-3.36 7.5-7.5 7.5S4 16.64 4 12.5c0-4 3-7 5-8.5.5 1.5 1.5 3 3 3 .5-1.5 1-3 0-5z"
      fill="url(#flameGrad)"
    />
    <!-- Inner Flame Detail -->
    <path
      d="M12 11c1.5 1 2 2.2 2 3.8 0 2.2-1.8 4-4 4s-4-1.8-4-4c0-1.8 1.2-3.2 2-4 .3.8 1 1.5 2 1.5.3-.5.5-1 0-1.3z"
      fill="#fef08a"
      opacity="0.9"
    />
  </g>
</svg>
